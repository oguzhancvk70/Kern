name: Kern
options:
  bundleIdPrefix: dev.kern
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.4

targets:
  Kern:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Generated
        createIntermediateGroups: true
      - path: Resources/FileIcons
        type: folder
      - path: Resources/extensions
        type: folder
      - Resources/AppIcon.icns
      - path: Kern.entitlements
        buildPhase: none
    dependencies:
      - package: Sparkle
    info:
      path: Info.plist
      properties:
        CFBundleName: Kern
        CFBundleDisplayName: Kern
        CFBundleShortVersionString: "0.1.0"
        CFBundleIconFile: AppIcon
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        SUFeedURL: https://github.com/oguzhancvk70/Kern/releases/latest/download/appcast.xml
        SUPublicEDKey: ""
        SUEnableAutomaticChecks: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.kern.open
            CFBundleURLSchemes: [kern]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Text
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.text, public.data]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kern.Kern
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge/Kern-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Generated
        OTHER_LDFLAGS: -lkern_ffi
      configs:
        Debug:
          LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/../../target.nosync/universal/debug
        Release:
          LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/../../target.nosync/universal/release
          # notarization için: sabit kimlik, hardened runtime, entitlement'lar
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_ENTITLEMENTS: Kern.entitlements
          CODE_SIGN_IDENTITY: "-"
          OTHER_CODE_SIGN_FLAGS: --timestamp
    preBuildScripts:
      - name: Rust kern-ffi
        script: '"$PROJECT_DIR/../../scripts/build-rust.sh"'
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Bundle kern CLI
        script: |
          P=debug; [ "$CONFIGURATION" = "Release" ] && P=release
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/bin"
          cp "$PROJECT_DIR/../../target.nosync/universal/$P/kern" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/bin/kern"
        basedOnDependencyAnalysis: false
